version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: "auto"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automerge"
    groups:
      dev-dependencies:
        patterns:
          - "@testing-library/*"
          - "@types/*"
          - "eslint*"
          - "prettier"
          - "vitest"
          - "typescript*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node on the same major as the Node LTS in .nvmrc
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
